name: Deploy (PsiQuant prod)

# Manual only. Deploys the current main to the production server
# (psiquant.xyz). The server is a git checkout at /opt/quant-tools; the deploy
# forces it to match origin/main, then rebuilds/recreates the stack.
#
# Required GitHub secret:
#   PSIQUANT_SSH_KEY  — private SSH key authorized as root@psiquant.xyz
on:
  workflow_dispatch:

jobs:
  syntax-check:
    name: Backend syntax gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all backend Python
        run: python -m compileall -q backend/app

  deploy:
    name: Deploy to production server
    needs: syntax-check
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PSIQUANT_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H psiquant.xyz >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy via SSH
        run: |
          # reset --hard (not pull) so the server always converges to origin/main
          # even if it carries local edits. Untracked files (backups, dumps) are kept.
          #
          # Deploy in two phases so the site never goes down:
          #  1. build all images while the OLD containers keep serving
          #  2. recreate ONLY the app containers (--no-deps) — nginx/db/redis are left
          #     running, so the public site stays up (brief 502s while api recreates).
          # Recreating api/realtime/compute also reloads their volume-mounted code.
          # The final `docker restart nginx` is required: recreating the app
          # containers gives them new IPs on the docker network, and nginx (left
          # running, not recreated) still holds the OLD upstream IPs -> 502s until it
          # re-resolves. A plain restart re-resolves without the depends_on health gate.
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
              root@psiquant.xyz \
              'cd /opt/quant-tools && \
               git fetch origin && git reset --hard origin/main && \
               docker compose -f docker-compose.prod.yml build && \
               docker compose -f docker-compose.prod.yml up -d --no-deps frontend api realtime compute && \
               docker restart quant_tools_nginx'

      - name: Health check
        run: |
          # nginx stays up throughout the deploy, but the recreated api can take a few
          # minutes to pass /health under CPU contention (realtime catch-up + compute
          # LOB recalc over ~1M runs). Poll patiently (~4 min) before failing.
          sleep 30
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "https://psiquant.xyz/health" >/dev/null 2>&1; then
              echo "Health check OK on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 12s..."
            sleep 12
          done
          echo "Health check failed after 20 attempts (~4 min)"
          exit 1
