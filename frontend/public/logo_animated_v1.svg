<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tech Psi with Hexagon Border - Final Animation -->
  <defs>
    <style>
      /* Hexagon draws around the static Psi */
      @keyframes hexagonDraw {
        from {
          stroke-dashoffset: 2200;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes hexagonDrawInner {
        from {
          stroke-dashoffset: 2100;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      .hexagon-outer {
        stroke-dasharray: 2200;
        stroke-dashoffset: 2200;
        animation: hexagonDraw 2s ease-in-out 0.5s forwards;
      }

      .hexagon-inner {
        stroke-dasharray: 2100;
        stroke-dashoffset: 2100;
        animation: hexagonDrawInner 2s ease-in-out 0.5s forwards;
      }
    </style>
  </defs>

  <g>
    <!-- Hexagon border - ANIMATED (draws) -->
    <path class="hexagon-outer" d="M 256 30 L 440 140 L 440 330 L 256 440 L 72 330 L 72 140 Z"
          fill="none"
          stroke="#0EA5E9"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Inner hexagon for tech effect - ANIMATED (draws) -->
    <path class="hexagon-inner" d="M 256 42 L 428 147 L 428 323 L 256 428 L 84 323 L 84 147 Z"
          fill="none"
          stroke="#0EA5E9"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.6"/>

    <!-- Psi symbol - STATIC (always visible) -->

    <!-- Left leg of U -->
    <path d="M 160 100 L 160 260 Q 160 300 256 300"
          stroke="#0EA5E9"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- Right leg of U -->
    <path d="M 352 100 L 352 260 Q 352 300 256 300"
          stroke="#0EA5E9"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- Inner left leg for tech effect -->
    <path d="M 180 110 L 180 255 Q 180 285 256 285"
          stroke="#0EA5E9"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
          opacity="0.6"/>

    <!-- Inner right leg for tech effect -->
    <path d="M 332 110 L 332 255 Q 332 285 256 285"
          stroke="#0EA5E9"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
          opacity="0.6"/>

    <!-- Vertical center stem -->
    <path d="M 256 30 L 256 440"
          stroke="#0EA5E9"
          stroke-width="36"
          stroke-linecap="round"
          fill="none"/>

    <!-- Inner vertical line -->
    <path d="M 256 42 L 256 428"
          stroke="#0EA5E9"
          stroke-width="6"
          stroke-linecap="round"
          fill="none"
          opacity="0.6"/>
  </g>
</svg>
