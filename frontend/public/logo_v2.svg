<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tech Psi - Bold version without hexagon -->
  <defs>
    <!-- Glow filter for neon effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- U shape (left leg, bottom curve, right leg) -->
    <path d="M 160 120 L 160 240 Q 160 300 256 300 Q 352 300 352 240 L 352 120"
          stroke="#0EA5E9"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- Inner U for double-line tech effect -->
    <path d="M 180 132 L 180 235 Q 180 285 256 285 Q 332 285 332 235 L 332 132"
          stroke="#0EA5E9"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
          opacity="0.6"/>

    <!-- Vertical center stem -->
    <path d="M 256 100 L 256 380"
          stroke="#0EA5E9"
          stroke-width="36"
          stroke-linecap="round"
          fill="none"/>

    <!-- Inner vertical line -->
    <path d="M 256 108 L 256 372"
          stroke="#0EA5E9"
          stroke-width="6"
          stroke-linecap="round"
          fill="none"
          opacity="0.6"/>

    <!-- Circuit details on Psi -->
    <circle cx="160" cy="170" r="7" fill="#0EA5E9"/>
    <circle cx="160" cy="220" r="7" fill="#0EA5E9"/>
    <circle cx="352" cy="170" r="7" fill="#0EA5E9"/>
    <circle cx="352" cy="220" r="7" fill="#0EA5E9"/>
    <circle cx="256" cy="300" r="9" fill="#0EA5E9"/>
    <circle cx="256" cy="150" r="7" fill="#0EA5E9"/>
  </g>
</svg>
