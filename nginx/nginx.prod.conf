events {
    worker_connections 1024;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # ============================================================
    # SECURITY: Rate Limiting (DDoS protection)
    # ============================================================
    # API: 200 req/min per IP = allows ~8 concurrent tabs with polling
    # Blocks script attacks (10k+ req/min) while normal users work fine
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=500r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream backends
    upstream backend {
        server api:8000;  # Multi-container: API container name
        keepalive 32;     # Keep 32 idle connections alive
    }

    upstream frontend {
        server frontend:80;
    }

    # Real client IP. TLS terminates at the server's shared Caddy proxy, which
    # reaches this container over a private docker network: without this, every
    # request would carry Caddy's address and share a single rate-limit bucket.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # Plain HTTP only: reachable from the Caddy proxy, never published on the host.
    server {
        listen 80;
        server_name psiquant.mango-dev.space;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # API proxy with DDoS protection
        location /api/ {
            # Rate limiting: 200 req/min per IP
            # burst=50 allows initial page load spike
            # Normal user (3 tabs): ~120 req/min = OK
            # Script attack (10k req/min): BLOCKED after 200 req
            limit_req zone=api_limit burst=50 nodelay;

            # Connection limit: Max 20 concurrent connections per IP
            limit_conn conn_limit 20;

            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check
        location /health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend with rate limiting
        location / {
            # Rate limiting: 500 req/min per IP
            # burst=100 allows initial page load with all assets
            limit_req zone=general_limit burst=100 nodelay;

            # Connection limit: Max 20 concurrent connections per IP
            limit_conn conn_limit 20;

            proxy_pass http://frontend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
