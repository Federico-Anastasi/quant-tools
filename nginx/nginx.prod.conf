events {
    worker_connections 1024;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # ============================================================
    # SECURITY: Rate Limiting Configuration (3-tier protection)
    # ============================================================

    # TIER 1: API endpoints - Strict limit (60 req/min = 1 req/sec)
    # Protects against aggressive scrapers and API abuse
    # burst=20 allows initial page load spikes (20 immediate requests)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # TIER 2: General traffic - High limit (600 req/min = 10 req/sec)
    # Protects frontend/static assets from excessive requests
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=600r/m;

    # TIER 3: Connection limit - Max 20 concurrent connections per IP
    # Protects against connection exhaustion attacks
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream backends
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    # HTTP server (redirect to HTTPS)
    server {
        listen 80;
        server_name psiquant.xyz www.psiquant.xyz;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name psiquant.xyz www.psiquant.xyz;

        # SSL certificates from Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/psiquant.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/psiquant.xyz/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # API proxy with rate limiting
        location /api/ {
            # Rate limiting: 60 req/min per IP (protects against aggressive scraping)
            # burst=20 allows page load spikes, nodelay responds immediately
            limit_req zone=api_limit burst=20 nodelay;

            # Connection limit: Max 10 concurrent connections per IP
            limit_conn conn_limit 10;

            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check
        location /health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend with rate limiting
        location / {
            # Rate limiting: 600 req/min = 10 req/sec
            # burst=100 allows initial page load with many assets
            limit_req zone=general_limit burst=100 nodelay;

            # SECURITY TIER 3: Max 20 concurrent connections per IP
            limit_conn conn_limit 20;

            proxy_pass http://frontend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
