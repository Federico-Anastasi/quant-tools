events {
    worker_connections 1024;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # DNS resolver for Docker internal DNS
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # HTTP server (redirect to HTTPS)
    server {
        listen 80;
        server_name psiquant.xyz www.psiquant.xyz;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name psiquant.xyz www.psiquant.xyz;

        # SSL certificates from Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/psiquant.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/psiquant.xyz/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # API proxy (with variable to force runtime DNS resolution)
        location /api/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check (with variable to force runtime DNS resolution)
        location /health {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend (with variable to force runtime DNS resolution)
        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
