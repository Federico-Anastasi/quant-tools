events {
    worker_connections 1024;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # ============================================================
    # SECURITY: Rate Limiting (DDoS protection)
    # ============================================================
    # API: 200 req/min per IP = allows ~8 concurrent tabs with polling
    # Blocks script attacks (10k+ req/min) while normal users work fine
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=500r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream backends
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    # HTTP server (redirect to HTTPS)
    server {
        listen 80;
        server_name psiquant.xyz www.psiquant.xyz;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name psiquant.xyz www.psiquant.xyz;

        # SSL certificates from Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/psiquant.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/psiquant.xyz/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # API proxy with DDoS protection
        location /api/ {
            # Rate limiting: 200 req/min per IP
            # burst=50 allows initial page load spike
            # Normal user (3 tabs): ~120 req/min = OK
            # Script attack (10k req/min): BLOCKED after 200 req
            # TEMPORARILY DISABLED FOR STRESS TEST
            # limit_req zone=api_limit burst=50 nodelay;

            # Connection limit: Max 20 concurrent connections per IP
            limit_conn conn_limit 20;

            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check
        location /health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend with rate limiting
        location / {
            # Rate limiting: 500 req/min per IP
            # burst=100 allows initial page load with all assets
            limit_req zone=general_limit burst=100 nodelay;

            # Connection limit: Max 20 concurrent connections per IP
            limit_conn conn_limit 20;

            proxy_pass http://frontend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
