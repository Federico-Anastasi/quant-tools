# Nginx configuration for Quant Tools
# Reverse proxy: Frontend + Backend unified access

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;  # Compress proxied responses
    gzip_comp_level 5;  # Balance CPU vs compression
    gzip_min_length 1024;  # Don't compress small responses
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Docker DNS resolver (127.0.0.11) with 30s cache
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Upstream servers with keepalive
    upstream backend {
        server backend:8000;
        keepalive 32;  # Keep 32 idle connections alive
        keepalive_requests 1000;  # Max requests per connection
        keepalive_timeout 60s;  # Keep idle connections for 60s
    }

    upstream frontend {
        server frontend:3000;
        keepalive 8;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # API endpoints → Backend
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CRITICAL: Enable keepalive to upstream (empty string, NOT "upgrade")
            proxy_set_header Connection "";

            # Buffering optimization for large responses
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;

            # Optimized timeouts (increased for bulk equity requests)
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check → Backend
        location /health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend → React dev server (development) or static files (production)
        # NOTE: /docs route now handled by frontend React Router (Docs.jsx page)
        # Backend Swagger/OpenAPI endpoints are disabled in production via main.py
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            # WebSocket support for Vite HMR
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Hot reload support (Vite)
            proxy_read_timeout 86400;
        }
    }
}
