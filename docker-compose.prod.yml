services:
  # TimescaleDB Database
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: quant_tools_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quant_tools
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # Must be set in .env file
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - quant_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant_user -d quant_tools"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quant_tools_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # PRODUCTION MODE: Disables /docs and enforces strict CORS
      ENV: production
      DATABASE_URL: postgresql://quant_user:${POSTGRES_PASSWORD}@db:5432/quant_tools
      WS_URL: wss://api.hyperliquid.xyz/ws
      # Your production frontend domain (set in .env file)
      FRONTEND_URL: ${FRONTEND_URL}
    networks:
      - quant_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend (Production Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""  # Empty for same-origin requests via Nginx
    container_name: quant_tools_frontend
    restart: unless-stopped
    networks:
      - quant_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: quant_tools_nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro  # SSL certificates from Certbot
      - /var/www/certbot:/var/www/certbot:ro  # ACME challenge for renewal
    networks:
      - quant_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  quant_network:
    name: quant_network

volumes:
  postgres_data:
    name: quant_tools_postgres_data
