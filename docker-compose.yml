version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: quant_tools_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quant_tools
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: quant_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"  # External port 5433 to avoid conflict with MangoLabs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant_user -d quant_tools"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quant_tools_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://quant_user:quant_password_2024@db:5432/quant_tools
      WS_URL: wss://api.hyperliquid.xyz/ws
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
    volumes:
      - ./backend:/app
    ports:
      - "8002:8000"  # Backend API on port 8002
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: quant_tools_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3002:3000"  # Frontend dev server on port 3002
    # No VITE_API_URL - uses empty string for same-origin requests via Nginx proxy
    command: npm run dev -- --host 0.0.0.0

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: quant_tools_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "8082:80"  # Unified access point
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    name: quant_tools_postgres_data
