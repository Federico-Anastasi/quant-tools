# ============================================================================
# MULTI-CONTAINER ARCHITECTURE - Local Testing
# ============================================================================
# 4-Container split with CPU reservations for 4-CPU server:
# 1. DB Container (1 CPU reserved) - PostgreSQL + TimescaleDB
# 2. API Container (1 CPU reserved) - FastAPI endpoints only
# 3. Real-Time Container (1 CPU reserved) - WebSocket + CVD + Runs + Bot Executor
# 4. Compute Container (1 CPU reserved) - Zone Analysis + LOB Calculation
# 5. Redis Container (no CPU limit) - Shared state (LOB cache, locks, pub/sub)
# 6. Nginx (no CPU limit) - Reverse proxy
# 7. Frontend (no CPU limit) - Static files
# ============================================================================

services:
  # ============================================================================
  # DATABASE (1 CPU reserved)
  # ============================================================================
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: quant_tools_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quant_tools
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: quant_password_2024
      # CRITICAL: Increase max_connections for 4 containers (4×25=100)
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    command: postgres -c max_connections=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - quant_network
    ports:
      - "5433:5432"  # Expose for local testing
    deploy:
      resources:
        reservations:
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant_user -d quant_tools"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # REDIS (no CPU limit)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: quant_tools_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - quant_network
    ports:
      - "6379:6379"  # Expose for local testing
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # API CONTAINER (1 CPU reserved)
  # ============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quant_tools_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: development
      CONTAINER_MODE: api  # API-only mode (no background tasks)
      DATABASE_URL: postgresql://quant_user:quant_password_2024@db:5432/quant_tools
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:8082
    volumes:
      - ./backend:/app  # Hot-reload for development
    networks:
      - quant_network
    ports:
      - "8000:8000"  # Expose API directly for testing
    deploy:
      resources:
        reservations:
          cpus: '1.0'
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # REAL-TIME CONTAINER (1 CPU reserved, SINGLETON)
  # ============================================================================
  realtime:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quant_tools_realtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: development
      DATABASE_URL: postgresql://quant_user:quant_password_2024@db:5432/quant_tools
      REDIS_URL: redis://redis:6379/0
      WS_URL: wss://api.hyperliquid.xyz/ws
    volumes:
      - ./backend:/app  # Hot-reload for development
    networks:
      - quant_network
    deploy:
      resources:
        reservations:
          cpus: '1.0'
    command: python -m app.main_realtime

  # ============================================================================
  # COMPUTE CONTAINER (1 CPU reserved)
  # ============================================================================
  compute:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quant_tools_compute
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: development
      DATABASE_URL: postgresql://quant_user:quant_password_2024@db:5432/quant_tools
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app  # Hot-reload for development
    networks:
      - quant_network
    deploy:
      resources:
        reservations:
          cpus: '1.0'
    command: python -m app.main_compute

  # ============================================================================
  # FRONTEND (no CPU limit)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: quant_tools_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - quant_network
    environment:
      VITE_API_URL: ""  # Same-origin via Nginx

  # ============================================================================
  # NGINX (no CPU limit)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: quant_tools_nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - quant_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  quant_network:
    name: quant_network

volumes:
  postgres_data:
    name: quant_tools_postgres_data
